name: Delta LMS Monitor

on:
  schedule:
    - cron: '*/30 * * * *' # تشغيل الفحص تلقائياً كل 30 دقيقة
  workflow_dispatch:

jobs:
  check-lms:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run LMS Monitor
        run: |
          python lms_monitor.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lms_state.json || true
          git commit -m "Update LMS state" || true
          git push
